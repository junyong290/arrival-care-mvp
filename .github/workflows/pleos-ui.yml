name: Pleos 2.1.0 APK runtime verification
on:
  push:
    paths:
      - '.github/workflows/pleos-ui.yml'
      - 'tools/setup_pleos_ci.py'
      - 'tools/verify_pleos_runtime.py'
      - 'apk/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pleos-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Inspect runner capacity and enable KVM
        run: |
          df -h "$RUNNER_TEMP"
          free -h
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install emulator graphics runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libnss3 libnspr4 libxcomposite1 libxcursor1 libxi6 libxdamage1 libxtst6 libxrandr2 libx11-xcb1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libglu1-mesa ffmpeg
      - name: Verify the signed submission APK from this commit
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          source = pathlib.Path('apk/Unrival_도착케어_release.apk')
          metadata = json.loads(pathlib.Path('apk/SUBMISSION_APK.json').read_text(encoding='utf-8-sig'))
          assert metadata['versionName'] == '0.3.1' and metadata['package'] == 'ai.arrivalcare.app.pleos'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == metadata['sha256']
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pleos-apks'
          target.mkdir()
          shutil.copyfile(source, target / 'arrivalcare-pleos-offline-0.3.1.apk')
          print('Exact signed submission APK:', metadata['sha256'])
          PY
      - name: Prepare official Pleos image and start cold-boot emulator
        run: python3 tools/setup_pleos_ci.py --out ci-evidence/pleos
      - name: Verify installed APK bytes and run actual Pleos UI
        run: |
          python3 tools/verify_pleos_runtime.py --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 --apks "$RUNNER_TEMP/pleos-apks" --out ci-evidence/pleos --boot-timeout 900 --version 0.3.1 --variant pleos --record
      - name: Stop task emulator
        if: always()
        run: timeout 15s "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pleos-2.1.0-signed-apk-runtime-evidence
          path: |
            ci-evidence/**
            !ci-evidence/**/*.apk
            !ci-evidence/**/*.img
            !ci-evidence/**/*.qcow2
          if-no-files-found: warn
