name: Android MVP
on:
  push:
    paths: ['app/**', 'gradle/**', '*.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'gradle/**', '*.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDemoOfflineDebugUnitTest :app:lintDemoOfflineDebug :app:assembleDemoOfflineRelease :app:assembleDemoKakaoRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: demo-unsigned
          path: app/build/outputs/apk/**/release/*.apk
  pleos-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew :app:assemblePleosOfflineRelease :app:assemblePleosKakaoRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pleos-unsigned
          path: app/build/outputs/apk/**/release/*.apk
