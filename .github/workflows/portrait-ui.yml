name: Portrait APK UI verification
on:
  push:
    paths: ['.github/workflows/portrait-ui.yml', 'tools/run_portrait_ci.py', 'tools/configure_ci_avd.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact signed release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.3.0 --repo "$GITHUB_REPOSITORY" --pattern arrivalcare-demo-offline-0.3.0.apk --dir ci-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          profile: pixel_2
          avd-name: ArrivalCarePortrait
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          pre-emulator-launch-script: python3 tools/configure_ci_avd.py
          script: python3 tools/run_portrait_ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portrait-signed-apk-evidence
          path: ci-evidence/
